services:
  - type: web
    name: idiomate
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /data/idiomate.sqlite
      - key: AUTO_SEED_VOCAB
        value: "false"
      - key: SEED_VOCAB_PATH
        value: /app/server/seed/vocab.txt
      - key: OWNER_VOCAB_PATH
        value: /app/Vocabs.txt
      - key: RUBI_PROFILE_USER_ID
        value: rubi
      - key: RUBI_PROFILE_NAME
        value: Rubi
      - key: OPENAI_MODEL_COACH
        value: gpt-4o
      - key: OPENAI_MODEL_UTILITY
        value: gpt-4o
      - key: LLM_UTILITY_PROVIDER
        value: auto
      - key: DEEPSEEK_MODEL_UTILITY
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: OWNER_VOCAB_CODE
        sync: false
      - key: RUBI_PROFILE_CODE
        sync: false
      - key: ADMIN_CODE
        sync: false
    disks:
      - name: idiomate-data
        mountPath: /data
        sizeGB: 1
